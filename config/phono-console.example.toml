[audio]
capture_device = "UFO202"
playback_device = "UFO202"
target_latency_ms = 40
sample_rate = 48000
channels = 2
detection_window_ms = 100

[detection]
phono_threshold_dbfs = -48.0
attack_ms = 250
release_ms = 5000
hysteresis_db = 6.0

[bluetooth]
enabled = false
capture_device = "bluealsa"
threshold_dbfs = -60.0
attack_ms = 200
release_ms = 2000
adapter = "hci0"
alias = "PhonoConsole"
pairing_window_seconds = 120

[routing]
distribution_target = "Downstairs"
local_fallback_enabled = true
distribution_recovery_hold_ms = 10000
distribution_start_timeout_ms = 5000
phono_mode_sticky_minutes = 60

[audio_engine]
# Use "timestamped" after installing the audio-engine service. Legacy remains
# the safe upgrade default until the new path is explicitly selected.
backend = "legacy"
socket_path = "/run/phono-console/audio-engine.sock"
frame_ms = 20
output_prebuffer_ms = 80
route_fade_ms = 8
max_soft_correction_ppm = 250
queue_frames = 50

[music_assistant]
base_url = "http://music-assistant.local"
console_player = "Phono Console"
vinyl_source = "Console Vinyl"
token_env = "PHONO_CONSOLE_MA_TOKEN"
# Players/groups targeted by the explicit whole-house API request.
whole_house_players = ["Downstairs"]

[sendspin]
server_url = "ws://music-assistant.local:8927/sendspin"
player_name = "Phono Console"
source_name = "Console Input"
# Publish the phono capture as a Music Assistant audio source.
source_enabled = true
# Persistent identity and pairing records for the source client.
state_dir = "/var/lib/phono-console/source"

[runtime]
poll_interval_ms = 100
# Listen on the LAN so Home Assistant can reach the authenticated API.
api_host = "0.0.0.0"
api_port = 8765
api_token_env = "PHONO_CONSOLE_API_TOKEN"
