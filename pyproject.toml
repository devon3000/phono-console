[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phono-console"
version = "0.1.0"
description = "Software audio router for local and whole-house vinyl playback"
requires-python = ">=3.12"
# The sendspin player is installed in its own venv by the installer because it
# pins aiosendspin 6.x while the in-process source client requires 9.x.
dependencies = [
  "aiohttp>=3.11,<4",
  "aiosendspin>=9.1,<10",
  "music-assistant-client>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phono-console = "phono_console.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phono_console = ["static/*.html", "static/*.css", "static/*.js"]
