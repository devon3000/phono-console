[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phono-console"
version = "0.1.0"
description = "Software audio router for local and whole-house vinyl playback"
requires-python = ">=3.11"
dependencies = [
  "aiosendspin>=9.1,<10",
  "music-assistant-client>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phono-console = "phono_console.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
